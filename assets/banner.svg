<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 52px;
      font-weight: 800;
      fill: url(#text-gradient);
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 500;
      fill: #9ca3af;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .animated-ring {
      transform-origin: 950px 200px;
      animation: spin 20s linear infinite;
    }
    .pulsing-node {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .floating-path {
      stroke-dasharray: 10, 10;
      animation: dash 30s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Background Dynamic Elements (Behind Text) -->
  <g opacity="0.35" class="pulsing-node">
    <!-- Globe Lines -->
    <circle cx="950" cy="200" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,8"/>
    <ellipse cx="950" cy="200" rx="140" ry="50" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <ellipse cx="950" cy="200" rx="60" ry="140" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  </g>

  <!-- Animated Rotating Tech Ring -->
  <g class="animated-ring" opacity="0.4">
    <circle cx="950" cy="200" r="170" fill="none" stroke="url(#text-gradient)" stroke-width="2" stroke-dasharray="20 40 60 40" />
  </g>

  <!-- Floating Connection Paths -->
  <path class="floating-path" d="M 100 320 Q 300 250 500 340 T 900 280 T 1100 350" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
  <path class="floating-path" d="M 50 80 Q 350 150 650 60 T 1000 120" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.2" />

  <!-- Interactive Nodes (Decorative Map Markers) -->
  <g opacity="0.6">
    <circle cx="850" cy="150" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <line x1="850" y1="150" x2="950" y2="200" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    
    <circle cx="1020" cy="260" r="8" fill="#c084fc" filter="url(#glow)"/>
    <line x1="1020" y1="260" x2="950" y2="200" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3"/>
    
    <circle cx="910" cy="280" r="5" fill="#818cf8" filter="url(#glow)"/>
  </g>

  <!-- Foreground Pill / Badge -->
  <g transform="translate(80, 80)">
    <rect width="260" height="34" rx="17" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
    <text x="36" y="22" class="badge-text">GEOSPATIAL &amp; MAP APIs 2026</text>
  </g>

  <!-- Main Title & Subtitle (Foreground, Crisp & Visible) -->
  <text x="80" y="185" class="title">Awesome Web Mapping</text>
  <text x="80" y="240" class="title" fill="url(#text-gradient)">Platform Ecosystem</text>
  <text x="80" y="295" class="subtitle">Curated SaaS Platforms, Geocoders, GIS Engines &amp; Open-Source Projects</text>
</svg>
